<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Temporarily Private</title>
    <meta name="description" content="This website is temporarily private and will be published at a later date.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, max-snippet:0, max-video-preview:0">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, max-snippet:0, max-video-preview:0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="canonical" href="https://ovin233.github.io/">
    <style>
        :root {
            --bg1: #041227;
            --bg2: #0b2f5f;
            --card: rgba(5, 20, 45, 0.78);
            --text: #eaf6ff;
            --muted: #b8d8ee;
            --border: rgba(150, 210, 255, 0.34);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 20%, rgba(109, 182, 255, 0.25), transparent 35%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            display: grid;
            place-items: center;
            padding: 1.2rem;
        }

        .card {
            width: min(680px, 100%);
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--card);
            backdrop-filter: blur(6px);
            padding: 1.8rem;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
        }

        h1 {
            margin: 0 0 0.7rem;
            font-size: clamp(1.7rem, 5vw, 2.3rem);
            letter-spacing: 0.01em;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Website Temporarily Private</h1>
        <p>
            This site is intentionally hidden for now and will be published later.
        </p>
    </main>
</body>
</html>
